name: Build & Release Applications

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Build web application
        run: npm run build
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Test desktop boundaries
        working-directory: desktop
        run: npm test
      - name: Build main and sandboxed preload
        working-directory: desktop
        env:
          KOVIES_API_KEY: ${{ secrets.KOVIES_API_KEY }}
        run: npm run build:main
      - name: Package Windows installer and portable executable
        working-directory: desktop
        run: npx --no-install electron-builder --win --x64 --publish never
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kovies-Windows-x64
          path: |
            desktop/release/*.exe
            desktop/release/*.exe.blockmap
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS (Universal / arm64 / x64)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Build web application
        run: npm run build
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Generate macOS application icons
        working-directory: desktop
        run: npm run icon
      - name: Test desktop boundaries
        working-directory: desktop
        run: npm test
      - name: Build main and sandboxed preload
        working-directory: desktop
        env:
          KOVIES_API_KEY: ${{ secrets.KOVIES_API_KEY }}
        run: npm run build:main
      - name: Package macOS DMG
        working-directory: desktop
        run: npx --no-install electron-builder --mac dmg --publish never
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kovies-macOS
          path: |
            desktop/release/*.dmg
            desktop/release/*.dmg.blockmap
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: Kovies-Windows-x64
          path: dist-release
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: Kovies-macOS
          path: dist-release
      - name: Prepare release files
        run: |
          mkdir -p release-upload
          # Copy setup and portable Windows executables
          cp dist-release/*.exe release-upload/ 2>/dev/null || true
          # Copy macOS DMGs
          cp dist-release/*.dmg release-upload/ 2>/dev/null || true
          # Also ensure generic Kovies-0.1.0.dmg exists if only arm64 was generated
          if [ -f release-upload/Kovies-0.1.0-arm64.dmg ] && [ ! -f release-upload/Kovies-0.1.0.dmg ]; then
            cp release-upload/Kovies-0.1.0-arm64.dmg release-upload/Kovies-0.1.0.dmg
          fi
          ls -lh release-upload
      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Kovies Latest' }}
          draft: false
          prerelease: false
          make_latest: true
          files: release-upload/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
